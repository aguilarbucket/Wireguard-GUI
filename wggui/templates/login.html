{% extends "base.html" %}
{% block title %}Acceso · WireGuard GUI{% endblock %}
{% block body %}
<main class="login-shell">
  <section class="login-card" aria-labelledby="login-title">
    <div class="brand-mark" aria-hidden="true">W</div>
    <p class="eyebrow">Administración privada</p>
    <h1 id="login-title">WireGuard GUI</h1>
    <p class="muted">Inicia sesión para administrar el servidor y sus clientes.</p>
    {% if error %}<div class="alert error" role="alert">{{ error }}</div>{% endif %}
    <form method="post" class="stack">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label for="password">Contraseña</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
      <button type="submit">Ingresar</button>
    </form>
  </section>
</main>
{% endblock %}
