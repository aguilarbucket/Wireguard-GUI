name: wireguard-gui

services:
  wireguard-gui:
    image: alejandroromeroa/wireguard-gui:${IMAGE_TAG:-latest}
    container_name: wireguard-gui
    restart: unless-stopped

    cap_add:
      - NET_ADMIN

    environment:
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      TZ: "${TZ:-America/Santiago}"

      # Autenticación
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:?Defina ADMIN_PASSWORD en .env}"

      # Servidor WireGuard
      SERVER_ENDPOINT: "${SERVER_ENDPOINT:?Defina SERVER_ENDPOINT en .env}"
      SERVER_PORT: "${SERVER_PORT:-51820}"
      VPN_SUBNET: "${VPN_SUBNET:-10.13.13.0/24}"

      # Configuración de clientes
      PEER_DNS: "${PEER_DNS:-1.1.1.1}"
      CLIENT_ALLOWED_IPS: "${CLIENT_ALLOWED_IPS:-0.0.0.0/0}"
      WG_MTU: "${WG_MTU:-}"

      # Seguridad de la interfaz web
      SESSION_COOKIE_SECURE: "${SESSION_COOKIE_SECURE:-false}"
      TRUSTED_PROXY_COUNT: "${TRUSTED_PROXY_COUNT:-0}"

      # Evitar generación automática de clientes
      LOG_CONFS: "false"

    volumes:
      - ./config:/config

    ports:
      # WireGuard VPN
      - "${SERVER_PORT:-51820}:${SERVER_PORT:-51820}/udp"

      # GUI: solo localhost
      - "127.0.0.1:${WEB_PORT:-51821}:51821/tcp"

    sysctls:
      net.ipv4.conf.all.src_valid_mark: "1"
      net.ipv4.ip_forward: "1"

    healthcheck:
      test:
        - CMD-SHELL
        - "wget -q -O /dev/null http://127.0.0.1:51821/health || exit 1"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
