name: wireguard-gui

services:
  wireguard-gui:
    build:
      context: .
      args:
        BASE_IMAGE: lscr.io/linuxserver/wireguard:latest
        VERSION: ${IMAGE_TAG:-0.2.0}
    image: alejandroromeroa/wireguard-gui:${IMAGE_TAG:-0.2.0}
    container_name: wireguard-gui
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Etc/UTC}
      # No definir PEERS: la GUI es la única propietaria de wg0.conf.
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Defina ADMIN_PASSWORD en .env}
      SERVER_ENDPOINT: ${SERVER_ENDPOINT:?Defina SERVER_ENDPOINT en .env}
      SERVER_PORT: ${SERVER_PORT:-51820}
      VPN_SUBNET: ${VPN_SUBNET:-10.13.13.0/24}
      PEER_DNS: ${PEER_DNS:-1.1.1.1}
      CLIENT_ALLOWED_IPS: ${CLIENT_ALLOWED_IPS:-0.0.0.0/0}
      WG_MTU: ${WG_MTU:-}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      TRUSTED_PROXY_COUNT: ${TRUSTED_PROXY_COUNT:-0}
    volumes:
      - ./config:/config
    ports:
      - "${SERVER_PORT:-51820}:${SERVER_PORT:-51820}/udp"
      # Seguro por defecto: publique la administración mediante un proxy HTTPS.
      - "127.0.0.1:${WEB_PORT:-51821}:51821/tcp"
    sysctls:
      net.ipv4.conf.all.src_valid_mark: "1"
      net.ipv4.ip_forward: "1"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:51821/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  cloudflare-ddns:
    image: favonia/cloudflare-ddns:1.18.0
    container_name: cloudflare-ddns
    profiles: ["ddns"]
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      DOMAINS: ${DDNS_DOMAIN:-vpn.example.com}
      PROXIED: "false"
      IP6_PROVIDER: none
      CLOUDFLARE_API_TOKEN_FILE: /run/secrets/cloudflare_api_token
    secrets:
      - cloudflare_api_token

secrets:
  cloudflare_api_token:
    file: ./secrets/cloudflare_api_token
